<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
            padding-bottom: 80px; /* Отступ снизу, чтобы кнопка и текст не сливались */
        }
        .block {
            margin-bottom: 20px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .row span {
            width: 20px;
            font-weight: bold;
            color: var(--tg-theme-hint-color, #888);
        }
        .row input {
            margin-bottom: 0;
        }
        /* Стиль для красного предупреждения */
        #char_warning {
            color: #ff3b30;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            display: none; /* Скрыто по умолчанию */
        }
    </style>
</head>
<body>

    <div class="block">
        <label>Ваш хэштег:</label>
        <input type="text" id="hashtag" value="#">
    </div>

    <div class="block">
        <label>🎯 Цель на весь период обучения:</label>
        <textarea id="global_goal" placeholder="Опишите цель..."></textarea>
    </div>

    <div class="block">
        <label>🗓 КАКИЕ ЗАДАЧИ БЕРУ НА НЕДЕЛЮ:</label>
        <div class="row"><span>1.</span><input type="text" class="week_task"></div>
        <div class="row"><span>2.</span><input type="text" class="week_task"></div>
        <div class="row"><span>3.</span><input type="text" class="week_task"></div>
    </div>

    <div class="block">
        <label>📋 ЧТО СДЕЛАЮ ЗАВТРА:</label>
        <div class="row"><span>1.</span><input type="text" class="tomorrow_task"></div>
        <div class="row"><span>2.</span><input type="text" class="tomorrow_task"></div>
        <div class="row"><span>3.</span><input type="text" class="tomorrow_task"></div>
        <div class="row"><span>4.</span><input type="text" class="tomorrow_task"></div>
        <div class="row"><span>5.</span><input type="text" class="tomorrow_task"></div>
    </div>

    <div class="block">
        <label>✔️ ЧТО СДЕЛАНО СЕГОДНЯ:</label>
        <div class="row"><span>1.</span><input type="text" class="today_task"></div>
        <div class="row"><span>2.</span><input type="text" class="today_task"></div>
        <div class="row"><span>3.</span><input type="text" class="today_task"></div>
        <div class="row"><span>4.</span><input type="text" class="today_task"></div>
        <div class="row"><span>5.</span><input type="text" class="today_task"></div>
    </div>

    <div class="block">
        <label>🌟 ИНСАЙТЫ ДНЯ:</label>
        <div class="row"><span>1.</span><input type="text" class="insight"></div>
        <div class="row"><span>2.</span><input type="text" class="insight"></div>
        <div class="row"><span>3.</span><input type="text" class="insight"></div>
        <div class="row"><span>4.</span><input type="text" class="insight"></div>
        <div class="row"><span>5.</span><input type="text" class="insight"></div>
    </div>

    <div class="block">
        <label>❓ ЗАПРОС:</label>
        <textarea id="request" placeholder="Если есть запрос к кураторам, напишите его здесь..."></textarea>
    </div>

    <div id="char_warning"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const MAX_CHARS = 3900;
        const warningDiv = document.getElementById('char_warning');
        const GREEN_COLOR = '#2cab37';
        const GRAY_COLOR = '#888888';

        tg.MainButton.textColor = '#ffffff';
        tg.MainButton.color = GREEN_COLOR; 
        tg.MainButton.text = "ОТПРАВИТЬ ОТЧЕТ";
        tg.MainButton.show();

        // Функция подсчета всех введенных символов
        function calculateTotalChars() {
            let total = 0;
            document.querySelectorAll('input[type="text"], textarea').forEach(input => {
                total += input.value.length;
            });
            return total;
        }

        // Проверка лимита при каждом вводе
        function checkLimits() {
            let currentLength = calculateTotalChars();
            
            if (currentLength > MAX_CHARS) {
                let excess = currentLength - MAX_CHARS;
                warningDiv.innerText = `Превышен лимит на ${excess} символов! Пожалуйста, сократите текст.`;
                warningDiv.style.display = 'block';
                
                // Делаем кнопку серой и отключаем её
                tg.MainButton.color = GRAY_COLOR;
                tg.MainButton.disable();
            } else {
                warningDiv.style.display = 'none';
                
                // Возвращаем зеленой и включаем
                tg.MainButton.color = GREEN_COLOR;
                tg.MainButton.enable();
            }
        }

        // Вешаем слушатель событий на все поля ввода
        document.querySelectorAll('input[type="text"], textarea').forEach(input => {
            input.addEventListener('input', checkLimits);
        });

        function getValuesByClass(className) {
            let inputs = document.querySelectorAll('.' + className);
            let values = [];
            inputs.forEach(input => {
                if(input.value.trim() !== '') {
                    values.push(input.value.trim());
                }
            });
            return values;
        }

        tg.MainButton.onClick(function() {
            // Двойная проверка на случай непредвиденных сбоев
            if (calculateTotalChars() > MAX_CHARS) return;

            let reportData = {
                hashtag: document.getElementById('hashtag').value,
                global_goal: document.getElementById('global_goal').value,
                week_tasks: getValuesByClass('week_task'),
                tomorrow_tasks: getValuesByClass('tomorrow_task'),
                today_tasks: getValuesByClass('today_task'),
                insights: getValuesByClass('insight'),
                request: document.getElementById('request').value
            };

            tg.sendData(JSON.stringify(reportData));
        });
    </script>
</body>
</html>
