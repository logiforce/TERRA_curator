<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отчет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
            padding-bottom: 80px; 
        }
        .block {
            margin-bottom: 20px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
        /* Хэштег оставили обычным инпутом (без расширения) */
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
            outline: none;
        }
        /* Все остальные поля стали textarea с возможностью потянуть за уголок */
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
            outline: none;
            resize: vertical; /* Разрешаем тянуть вниз */
            min-height: 45px; /* Базовая высота */
            font-family: inherit;
        }
        .row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .row span {
            width: 20px;
            font-weight: bold;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 12px; 
        }
        .row textarea {
            flex-grow: 1;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="block">
        <label>Ваш хэштег:</label>
        <input type="text" id="hashtag" value="#">
    </div>

    <div class="block">
        <label>🎯 Цель на весь период обучения:</label>
        <textarea id="global_goal" placeholder="Опишите цель..." style="min-height: 80px;"></textarea>
    </div>

    <div class="block">
        <label>🗓 КАКИЕ ЗАДАЧИ БЕРУ НА НЕДЕЛЮ:</label>
        <div class="row"><span>1.</span><textarea class="week_task" rows="1"></textarea></div>
        <div class="row"><span>2.</span><textarea class="week_task" rows="1"></textarea></div>
        <div class="row"><span>3.</span><textarea class="week_task" rows="1"></textarea></div>
    </div>

    <div class="block">
        <label>📋 ЧТО СДЕЛАЮ ЗАВТРА:</label>
        <div class="row"><span>1.</span><textarea class="tomorrow_task" rows="1"></textarea></div>
        <div class="row"><span>2.</span><textarea class="tomorrow_task" rows="1"></textarea></div>
        <div class="row"><span>3.</span><textarea class="tomorrow_task" rows="1"></textarea></div>
        <div class="row"><span>4.</span><textarea class="tomorrow_task" rows="1"></textarea></div>
        <div class="row"><span>5.</span><textarea class="tomorrow_task" rows="1"></textarea></div>
    </div>

    <div class="block">
        <label>✔️ ЧТО СДЕЛАНО СЕГОДНЯ:</label>
        <div class="row"><span>1.</span><textarea class="today_task" rows="1"></textarea></div>
        <div class="row"><span>2.</span><textarea class="today_task" rows="1"></textarea></div>
        <div class="row"><span>3.</span><textarea class="today_task" rows="1"></textarea></div>
        <div class="row"><span>4.</span><textarea class="today_task" rows="1"></textarea></div>
        <div class="row"><span>5.</span><textarea class="today_task" rows="1"></textarea></div>
    </div>

    <div class="block">
        <label>🌟 ИНСАЙТЫ ДНЯ:</label>
        <div class="row"><span>1.</span><textarea class="insight" rows="1"></textarea></div>
        <div class="row"><span>2.</span><textarea class="insight" rows="1"></textarea></div>
        <div class="row"><span>3.</span><textarea class="insight" rows="1"></textarea></div>
        <div class="row"><span>4.</span><textarea class="insight" rows="1"></textarea></div>
        <div class="row"><span>5.</span><textarea class="insight" rows="1"></textarea></div>
    </div>

    <div class="block">
        <label>❓ ЗАПРОС:</label>
        <textarea id="request" placeholder="Если есть запрос к кураторам, напишите его здесь..." style="min-height: 80px;"></textarea>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        const MAX_BYTES = 3700; // Безопасный лимит байтов для Telegram
        let isValid = true; // Флаг, разрешающий отправку

        // Базовые цвета
        const GREEN_COLOR = '#2cab37';
        const GRAY_COLOR = '#e0e0e0';
        const RED_TEXT = '#ff3b30';
        const WHITE_TEXT = '#ffffff';

        tg.MainButton.setParams({
            text: "ОТПРАВИТЬ ОТЧЕТ",
            color: GREEN_COLOR,
            text_color: WHITE_TEXT,
            is_visible: true
        });

        // Сбор данных со страницы
        function getReportData() {
            let data = {
                hashtag: document.getElementById('hashtag').value,
                global_goal: document.getElementById('global_goal').value,
                week_tasks: getValuesByClass('week_task'),
                tomorrow_tasks: getValuesByClass('tomorrow_task'),
                today_tasks: getValuesByClass('today_task'),
                insights: getValuesByClass('insight'),
                request: document.getElementById('request').value
            };
            return data;
        }

        function getValuesByClass(className) {
            let inputs = document.querySelectorAll('.' + className);
            let values = [];
            inputs.forEach(input => {
                if(input.value.trim() !== '') values.push(input.value.trim());
            });
            return values;
        }

        // Проверка лимитов (теперь считаем реальный вес в байтах)
        function checkLimits() {
            let reportData = getReportData();
            let jsonString = JSON.stringify(reportData);
            
            // TextEncoder переводит строку в реальные байты UTF-8
            let byteSize = new TextEncoder().encode(jsonString).length;
            
            if (byteSize > MAX_BYTES) {
                isValid = false;
                // Примерно переводим лишние байты обратно в символы (делим на 2 для кириллицы)
                let excessChars = Math.ceil((byteSize - MAX_BYTES) / 2);
                
                tg.MainButton.setParams({
                    text: `Превышен лимит на ${excessChars} символов!`,
                    color: GRAY_COLOR, // Серый фон
                    text_color: RED_TEXT // КРАСНЫЙ текст
                });
            } else {
                isValid = true;
                tg.MainButton.setParams({
                    text: "ОТПРАВИТЬ ОТЧЕТ",
                    color: GREEN_COLOR,
                    text_color: WHITE_TEXT
                });
            }
        }

        // Вешаем слушатель на любой ввод
        document.querySelectorAll('input, textarea').forEach(input => {
            input.addEventListener('input', checkLimits);
        });

        // Клик по главной кнопке
        tg.MainButton.onClick(function() {
            // Если флаг запрещает отправку (лимит превышен) — блокируем и вибрируем
            if (!isValid) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            // Отправляем сформированный JSON
            let finalData = getReportData();
            tg.sendData(JSON.stringify(finalData));
        });
    </script>
</body>
</html>
